name: CI/CD Pipeline

on:
  push:
    branches: [ prod, dev ]
  pull_request:
    branches: [ prod ]

env:
  NODE_VERSION: '18'

jobs:
  # Job de testing
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install root dependencies
      run: npm ci
    
    - name: Install client dependencies
      run: |
        cd client
        npm ci
    
    - name: Install server dependencies
      run: |
        cd server
        npm ci
    
    - name: Run client tests
      run: npm run test:client
      env:
        CI: true
    
    - name: Run server tests
      run: npm run test:server
      env:
        CI: true
        NODE_ENV: test
    
    - name: Generate coverage reports
      run: |
        npm run test:coverage:client
        npm run test:coverage:server
    
    - name: Upload client coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./client/coverage/lcov.info
        flags: client
        name: client-coverage
    
    - name: Upload server coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./server/coverage/lcov.info
        flags: server
        name: server-coverage

  # Job de lint y code quality
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd client && npm ci
        cd ../server && npm ci
    
    # Nota: Agrega estos scripts a tu package.json si quieres lint
    # - name: Run ESLint on client
    #   run: cd client && npm run lint
    # 
    # - name: Run ESLint on server
    #   run: cd server && npm run lint

  # Job de build
  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install client dependencies
      run: |
        cd client
        npm ci
    
    - name: Build client
      run: |
        cd client
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: client/build/
        retention-days: 7

  # Job de deployment a staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/dev'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-files
        path: client/build/
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Aquí agregar comandos específicos de deployment
        # Por ejemplo, para Vercel, Netlify, AWS, etc.
    
    # Ejemplo para Vercel:
    # - name: Deploy to Vercel (Staging)
    #   uses: amondnet/vercel-action@v25
    #   with:
    #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
    #     vercel-org-id: ${{ secrets.ORG_ID }}
    #     vercel-project-id: ${{ secrets.PROJECT_ID }}
    #     working-directory: ./client

  # Job de deployment a producción
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/prod'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-files
        path: client/build/
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Aquí agregar comandos específicos de deployment para producción
    
    # Ejemplo para deployment via SSH:
    # - name: Deploy via SSH
    #   uses: appleboy/ssh-action@v1.0.0
    #   with:
    #     host: ${{ secrets.HOST }}
    #     username: ${{ secrets.USERNAME }}
    #     key: ${{ secrets.KEY }}
    #     script: |
    #       cd /path/to/your/app
    #       git pull origin prod
    #       npm install
    #       npm run build
    #       pm2 restart your-app

  # Job de notificaciones
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Notify Slack on success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '✅ Deployment successful!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Notify Slack on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ Deployment failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
